<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ace="http://www.icefaces.org/icefaces/components"
                xmlns:c="http://java.sun.com/jsp/jstl/core"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:icecore="http://www.icefaces.org/icefaces/core"
                xmlns:ice="http://www.icesoft.com/icefaces/component"
                xmlns:o="http://omnifaces.org/ui"
                xmlns:of="http://omnifaces.org/functions">

    <o:form id="frmComponenteProducto">
        <ice:panelGroup id="tituloPagina" styleClass="tituloPagina">
            <ice:outputLabel value="#{labels.grupo_trabajo_titulo}"/>
        </ice:panelGroup>

        <ice:panelGroup styleClass="btnAgregarABM">
            <ace:pushButton value="#{labels.grupo_trabajo_agregar}" 
                            styleClass="boton principal agregar"
                            action="#{grupoTrabajoMB.agregar()}" />
        </ice:panelGroup>

        <ice:panelGroup id="espacioTrabajo" styleClass="buscador recuadro margen-inf">
            <ice:outputText value="#{labels.busqueda}" styleClass="subtitulo"/> 

            <ice:panelGrid styleClass="formulario" columns="6">
                <ice:outputLabel value="#{labels.componenteProducto_busqueda_nombre}"/>
                <ace:textEntry value="#{grupoTrabajoMB.filtroNombre}" />
                <ice:outputLabel value="#{labels.hSsUsuario}"/>
                <ice:selectOneMenu id="comboGerente" value="#{grupoTrabajoMB.listaGerenteCombo.selected}"
                                   >  
                    <f:selectItems value="#{grupoTrabajoMB.listaGerenteCombo.items}"/>
                </ice:selectOneMenu>
                <ice:outputLabel value="#{labels.habilitado}"/>

                <ace:simpleSelectOneMenu value="#{grupoTrabajoMB.filtroHabilitado}" styleClass="textoMedio">
                    <f:selectItem itemLabel="#{labels.comboTodos}" itemValue=""/>
                    <f:selectItem itemLabel="#{labels.si}" itemValue="1"/>
                    <f:selectItem itemLabel="#{labels.no}" itemValue="0"/>
                    <ace:ajax />
                </ace:simpleSelectOneMenu>
            </ice:panelGrid>

            <ice:panelGroup styleClass="panelAcciones" >
                <ice:panelGroup styleClass="panelBotones" >
                    <!--                    <ace:messages id="busquedaMsg" />-->
                    <ace:pushButton value="#{labels.buscar}" 
                                    styleClass="boton principal buscar" 
                                    action="#{grupoTrabajoMB.buscar()}"/>

                    <ace:linkButton value="#{labels.limpiar}" 
                                    styleClass="boton secundario" 
                                    action="#{grupoTrabajoMB.limpiar()}"/>
                </ice:panelGroup>
            </ice:panelGroup>
        </ice:panelGroup>

        <ice:panelGroup id="resultado" styleClass="resultado recuadro margen-sup" >
            <ice:outputText value="#{labels.resultadoBusqueda}: #{grupoTrabajoMB.listaResultado.size()} #{labels.elementosResultado}." 
                            styleClass="resultadoBusqueda"/>
            <ice:panelGroup rendered="#{not empty grupoTrabajoMB.listaResultado}"
                            styleClass="resultadoCompleto">
                <ice:panelGroup  styleClass="funcionalidadesResultado"  >
                    <ice:outputLabel value="#{labels.elementosPorPagina}"/>
                    <ace:simpleSelectOneMenu value="#{grupoTrabajoMB.cantElementosPorPagina}" 
                                             styleClass="textoCorto"
                                             valueChangeListener="#{grupoTrabajoMB.cambiarCantPaginas}">
                        <f:selectItem itemLabel="25" itemValue="25"/>
                        <f:selectItem itemLabel="50" itemValue="50"/>
                        <f:selectItem itemLabel="100" itemValue="100"/>
                        <ace:ajax />
                    </ace:simpleSelectOneMenu>

                    <ice:outputLabel value="#{labels.ordenar_por}:"/>
                    <ace:simpleSelectOneMenu value="#{grupoTrabajoMB.elementoOrdenacion}" styleClass="textoMedio"
                                             valueChangeListener="#{grupoTrabajoMB.cambiarCriterioOrdenacion}">
                        <f:selectItem itemLabel="#{labels.componenteProducto_busqueda_nombre}" itemValue="gtbNombre"/>
                        <ace:ajax />
                    </ace:simpleSelectOneMenu>
                    <ace:simpleSelectOneMenu value="#{grupoTrabajoMB.ascendente}" styleClass="textoMedio"
                                             valueChangeListener="#{grupoTrabajoMB.cambiarAscendenteOrdenacion}">
                        <f:selectItem itemLabel="#{labels.ascendente}" itemValue="1"/>
                        <f:selectItem itemLabel="#{labels.descendente}" itemValue="0"/>
                        <ace:ajax />
                    </ace:simpleSelectOneMenu>

                    <ace:dataExporter target="tblResultados" label="#{labels.exportarPlanilla}" 
                                      type="xls" fileName="#{labels.grupo_trabajo_titulo}"
                                      includeHeaders="true"  />
                </ice:panelGroup>

                <ice:panelGroup rendered="#{grupoTrabajoMB.listaResultado != null and not empty grupoTrabajoMB.listaResultado}" 
                                styleClass="cuerpo">
                    <ace:dataTable id="tblResultados" 
                                   value="#{grupoTrabajoMB.listaResultado}" 
                                   var="componenteProducto" 
                                   styleClass="tablaResultados table-responsive"
                                   paginator="true" pageCount="5" 
                                   rows="#{grupoTrabajoMB.cantElementosPorPagina}">
                        <ace:column headerText="#{labels.componenteProducto_head_pk}" >
                            <h:outputText value="#{componenteProducto.gtbPk}"/>
                        </ace:column>

                        <ace:column headerText="#{labels.componenteProducto_head_nombre}">
                            <h:outputText value="#{componenteProducto.gtbNombre}"/>
                        </ace:column>

                        <ace:column headerText="#{labels.grupo_trabajo_habilitado}">
                            <ice:panelGroup title="#{labels.habilitar_deshabilitar}">
                                <ace:checkboxButton value="#{componenteProducto.gtbHabilitado}"  disabled="true"
                                                    valueChangeListener="#{grupoTrabajoMB.componenteProductoChange(componenteProducto)}" >
                                    <ace:ajax/>
                                </ace:checkboxButton>
                            </ice:panelGroup>
                        </ace:column>

                        <ace:column headerText="" styleClass="columnaBoton" >

                            <h:commandButton id="linkEditarFicha2"
                                             action="#{inicioMB.irEditarGrupoTrabajo(inicioMB.encryptParam(componenteProducto.gtbPk), false)}" 
                                             styleClass="botonEditar iconoTabla" 
                                             >
                            </h:commandButton>




                        </ace:column>
                        <ace:column headerText="" styleClass="columnaBoton">
                            <ice:panelGroup title="#{labels.componente_producto_eliminar}">
                                <h:commandButton onclick="confirmationEliminar#{componenteProducto.gtbPk}.show()"
                                                 styleClass="botonEliminar iconoTabla" 
                                                 type="button"/>

                                <ace:confirmationDialog id="confirmDialogEliminar"
                                                        widgetVar="confirmationEliminar#{componenteProducto.gtbPk}"
                                                        message="#{labels.confirmacionEliminacion}"
                                                        header="#{labels.hConfirmacion}"
                                                        closable="true"
                                                        closeOnEscape="true"
                                                        severity="info"
                                                        modal="true"
                                                        position="center">
                                    <h:panelGrid columns="2" styleClass="centeredPanelGrid">
                                        <h:commandButton id="yesEliminar"
                                                         value="#{labels.si}"
                                                         styleClass="boton principal botonContinuar"
                                                         onclick="confirmationEliminar#{componenteProducto.gtbPk}.hide()" 
                                                         actionListener="#{grupoTrabajoMB.eliminar(componenteProducto.gtbPk)}"/>
                                        <h:commandButton id="noEliminar"
                                                         value="#{labels.no}"
                                                         styleClass="boton principal botonEliminar"
                                                         onclick="confirmationEliminar#{componenteProducto.gtbPk}.hide()"  />
                                    </h:panelGrid>
                                </ace:confirmationDialog> 
                            </ice:panelGroup>
                        </ace:column>

                    </ace:dataTable>
                </ice:panelGroup>
            </ice:panelGroup>

            <ice:panelGroup styleClass="noResultados" rendered="#{empty grupoTrabajoMB.listaResultado}">
                <ice:outputText value="#{labels.noHayResultados}"/>
            </ice:panelGroup>

        </ice:panelGroup>
    </o:form>
</ui:composition>
