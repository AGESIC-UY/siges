<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">

<ui:composition xmlns:ui="http://java.sun.com/jsf/facelets"
                xmlns="http://www.w3.org/1999/xhtml"
                xmlns:ace="http://www.icefaces.org/icefaces/components"
                xmlns:c="http://java.sun.com/jsp/jstl/core"
                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:h="http://java.sun.com/jsf/html"
                xmlns:icecore="http://www.icefaces.org/icefaces/core"
                xmlns:ice="http://www.icesoft.com/icefaces/component"
                xmlns:o="http://omnifaces.org/ui"
                xmlns:of="http://omnifaces.org/functions">

    <o:form id="frmComponenteProducto">
        <ice:panelGroup id="tituloPagina" styleClass="tituloPagina">
            <ice:outputLabel value="#{labels.adquisicion_log}"/>
        </ice:panelGroup>


        <ice:panelGroup id="espacioTrabajo" styleClass="buscador recuadro margen-inf">
            <ice:outputText value="#{labels.busqueda}" styleClass="subtitulo"/> 

            <h:panelGrid styleClass="formulario" columns="2">

                <h:panelGrid columns="2">
                    <ice:outputLabel value="#{labels.adquisicionNombre}"/>
                    <ace:textEntry value="#{adquisicionInfoMB.filtroNombre}" />

                    <ice:outputLabel value="#{labels.adquisicion_log_filtro_proyprog}"/>
                    <ace:textEntry value="#{adquisicionInfoMB.filtroNombreProyecto}" />
                </h:panelGrid>

                <h:panelGrid columns="2">
                    <ice:outputLabel value="#{labels.adquisicionIdAdquisicion}"/>
                    <ace:textEntry value="#{adquisicionInfoMB.filtroIdAdquisicion}" />
                    <ice:outputLabel value="#{labels.adquisicion_log_filtro_proyprog_codigo}"/>
                    <ace:textEntry value="#{adquisicionInfoMB.filtroCodigoProyecto}" />
                </h:panelGrid>


            </h:panelGrid>
            <ice:panelGroup styleClass="panelAcciones" style="margin-top: 40px">
                <ice:panelGroup styleClass="panelBotones" style="float:left; clear: none; margin-top: -4px;">
                    <ice:panelGroup styleClass="panelBotones" >
                        <!--                        <ace:messages id="busquedaMsg" globalOnly="true"/>-->
                        <ace:pushButton value="#{labels.buscar}" 
                                        styleClass="boton principal buscar" 
                                        action="#{adquisicionInfoMB.buscar()}"/>

                        <ace:linkButton value="#{labels.limpiar}" 
                                        styleClass="boton secundario" 
                                        action="#{adquisicionInfoMB.limpiar()}"/>
                    </ice:panelGroup>
                </ice:panelGroup>
            </ice:panelGroup>
        </ice:panelGroup>

        <ice:panelGroup id="resultado" styleClass="resultado recuadro margen-sup" >
            <ice:outputText value="#{labels.resultadoBusqueda}: #{adquisicionInfoMB.listaResultado.size()} #{labels.elementosResultado}." 
                            styleClass="resultadoBusqueda"/>
            <ice:panelGroup rendered="#{not empty adquisicionInfoMB.listaResultado}"
                            styleClass="resultadoCompleto">
                <ice:panelGroup  styleClass="funcionalidadesResultado"  >
                    <ice:outputLabel value="#{labels.elementosPorPagina}"/>
                    <ace:simpleSelectOneMenu value="#{adquisicionInfoMB.cantElementosPorPagina}" 
                                             styleClass="textoCorto"
                                             valueChangeListener="#{adquisicionInfoMB.cambiarCantPaginas}">
                        <f:selectItem itemLabel="25" itemValue="25"/>
                        <f:selectItem itemLabel="50" itemValue="50"/>
                        <f:selectItem itemLabel="100" itemValue="100"/>
                        <ace:ajax />
                    </ace:simpleSelectOneMenu>

                    <ice:outputLabel value="#{labels.ordenar_por}:"/>
                    <ace:simpleSelectOneMenu value="#{adquisicionInfoMB.elementoOrdenacion}" styleClass="textoMedio"
                                             valueChangeListener="#{adquisicionInfoMB.cambiarCriterioOrdenacion}">
                         <f:selectItem itemLabel="#{labels.inicio_col_Fecha}" itemValue="ladFecha"/>
                        <f:selectItem itemLabel="#{labels.adquisicionIdAdquisicion}" itemValue="ladAquisicionFk.adqIdAdquisicion"/>
                        <f:selectItem itemLabel="#{labels.adquisicionNombre}" itemValue="ladAquisicionFk.adqNombre"/>
                       
                        <ace:ajax />
                    </ace:simpleSelectOneMenu>
                    <ace:simpleSelectOneMenu value="#{adquisicionInfoMB.ascendente}" styleClass="textoMedio"
                                             valueChangeListener="#{adquisicionInfoMB.cambiarAscendenteOrdenacion}">
                        <f:selectItem itemLabel="#{labels.ascendente}" itemValue="1"/>
                        <f:selectItem itemLabel="#{labels.descendente}" itemValue="0"/>
                        <ace:ajax />
                    </ace:simpleSelectOneMenu>

                    <ace:dataExporter target="tblResultados" label="#{labels.exportarPlanilla}" 
                                      type="xls" fileName="#{labels.exportarPlantillaProcedimientoCompraInfo}"
                                      includeHeaders="true" />
                </ice:panelGroup>

                <ice:panelGroup rendered="#{adquisicionInfoMB.listaResultado != null and not empty adquisicionInfoMB.listaResultado}" 
                                styleClass="cuerpo">
                    <ace:dataTable id="tblResultados" 
                                   value="#{adquisicionInfoMB.listaResultado}" 
                                   var="procedimientoCompra" 
                                   styleClass="tablaResultados table-responsive"
                                   paginator="true"
                                   pageCount="5"
                                   rows="#{adquisicionInfoMB.cantElementosPorPagina}">


                        <ace:column headerText="#{labels.adquisicion_log_h_adquisicion_pk}" >
                            <h:outputText value="#{procedimientoCompra.ladAquisicionFk.adqPk}"/>
                        </ace:column>

                        <ace:column headerText="#{labels.adquisicionNombre}">
                            <h:outputText value="#{procedimientoCompra.ladAquisicionFk.adqNombre}"/>
                        </ace:column>

                        <ace:column headerText="#{labels.adquisicionIdAdquisicion}" >
                            <h:outputText value="#{procedimientoCompra.ladAquisicionFk.adqIdAdquisicion}"/>
                        </ace:column>

                      

                        <ace:column headerText="#{labels.adquisicion_log_h_cod_proyecto}">
                            <h:outputText value="#{procedimientoCompra.ladAquisicionFk.adqPreFk.proyecto.proyPk}"/>
                        </ace:column>



                        <ace:column headerText="#{labels.adquisicion_log_h_usuario}">
                            <h:outputText value="#{procedimientoCompra.ladUsuario}"/>
                        </ace:column>

                        <ace:column headerText="#{labels.inicio_col_Fecha}" >
                            <h:outputText value="#{procedimientoCompra.ladFecha}" converter="#{localDateTimeConverter}" />
                        </ace:column>

                        <ace:column headerText="#{labels.adquisicion_detalle}">
                            <h:outputText value="#{procedimientoCompra.ladDetalle}"/>
                        </ace:column>





                    </ace:dataTable>
                </ice:panelGroup>
            </ice:panelGroup>

            <ice:panelGroup styleClass="noResultados" rendered="#{empty adquisicionInfoMB.listaResultado}">
                <ice:outputText value="#{labels.noHayResultados}"/>
            </ice:panelGroup>

        </ice:panelGroup>
    </o:form>
</ui:composition>
