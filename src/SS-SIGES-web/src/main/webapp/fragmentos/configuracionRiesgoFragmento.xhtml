                xmlns:f="http://java.sun.com/jsf/core"
                xmlns:h="http://java.sun.com/jsf/html"

                xmlns:o="http://omnifaces.org/ui"

    <o:form id="configuracionRiesgos">

        <style>
            .ui-footer-column{
                background-color: white !important;
            }
        </style>
        <!-- Titulo -->
        <ice:panelGroup id="tituloPagina" styleClass="tituloPagina">
            <ice:outputLabel value="#{labels.tituloConfiguracionRiesgos}"/>
        </ice:panelGroup>

        <ice:panelGroup id="limiteRiesgos">
            <ice:panelGrid  styleClass="formulario " columns="4">
                <h:outputText value="#{labels.limiteAmarillo}"/>
                <ace:textEntry value="#{configuracionMB.confRiesgoLimiteAmarillo.cnfValor}"
                               converter="decimalFormatConverter"/>
                
                <h:outputText value="#{labels.limiteRojo}"/>
                <ace:textEntry value="#{configuracionMB.confRiesgoLimiteRojo.cnfValor}"
                               converter="decimalFormatConverter"/>
                
                <h:outputText value="#{labels.limiteTiempoAmarillo}"/>
                <ace:textEntry value="#{configuracionMB.confRiesgoTiempoLimiteAmarillo.cnfValor}"
                               converter="IntegerFormatConverter"/>
                
                <h:outputText value="#{labels.limiteTiempoRojo}"/>
                <ace:textEntry value="#{configuracionMB.confRiesgoTiempoLimiteRojo.cnfValor}"
                               converter="IntegerFormatConverter"/>
                 <h:outputText value="#{labels.tituloEjeX}"/>
                <ace:textEntry value="#{configuracionMB.confTituloRiesgoX.cnfValor}"
                              />
                
                <h:outputText value="#{labels.tituloEjeY}"/>
                <ace:textEntry value="#{configuracionMB.confTituloRiesgoY.cnfValor}"
                               />
                
                 <h:outputText value="#{labels.valoresEjeX}"/>
                <ace:textEntry value="#{configuracionMB.confValoresRiesgoX.cnfValor}"
                              />
                
                <h:outputText value="#{labels.valoresEjeY}"/>
                <ace:textEntry value="#{configuracionMB.confValoresRiesgoY.cnfValor}"
                              />
                
            </ice:panelGrid>

            <ice:panelGrid styleClass="panelBotones" >
                <ace:messages id="msj1" />
                <ace:pushButton value="Guardar" 
                                action="#{configuracionMB.guardarRiesgoLimite}" 
                                styleClass="guardar" />
            </ice:panelGrid>
        </ice:panelGroup>

        <ice:panelGroup id="tablaConf">
            <ace:dataTable  id="tblConfRiesgo" value="#{configuracionMB.limiteGestionRiesgos}" var="risk"
                            paginator="true" pageCount="5" 
                            rows="#{configuracionMB.cantElementosPorPagina}">
                <ace:column>
                    <h:outputText value="#{configuracionMB.impactoNuevaConfiguracion(risk.impacto)}"/>
                </ace:column>
                <ace:column footerText="#{configuracionMB.obtenerValorX(1)}" style="background-color: #{configuracionMB.riesgoColorNuevaConfiguracion(risk.val1,1)}">
                    <h:outputText value="#{risk.val1}"/>
                </ace:column>
                <ace:column footerText="#{configuracionMB.obtenerValorX(2)}" style="background-color: #{configuracionMB.riesgoColorNuevaConfiguracion(risk.val2,1)}" >
                    <h:outputText value="#{risk.val2}"/>
                </ace:column>
                <ace:column footerText="#{configuracionMB.obtenerValorX(3)}" style="background-color: #{configuracionMB.riesgoColorNuevaConfiguracion(risk.val3,1)}">
                    <h:outputText value="#{risk.val3}"/>
                </ace:column>
                <ace:column footerText="#{configuracionMB.obtenerValorX(4)}" style="background-color: #{configuracionMB.riesgoColorNuevaConfiguracion(risk.val4,1)}" >
                    <h:outputText value="#{risk.val4}"/>
                </ace:column>
                <ace:column footerText="#{configuracionMB.obtenerValorX(5)}"  style="background-color: #{configuracionMB.riesgoColorNuevaConfiguracion(risk.val5,1)}">
                    <h:outputText value="#{risk.val5}"/>
                </ace:column>
            </ace:dataTable>
        </ice:panelGroup>
        
        <ice:panelGroup id="tituloConfiguracion" style="margin-top: 20px" >
            <ice:outputText value="#{labels.configuracionMapaCalor}" styleClass="subtitulo"/>
        </ice:panelGroup>

            <ice:panelGrid styleClass="panelBotones" >
